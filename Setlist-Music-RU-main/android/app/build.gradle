plugins { id 'com.android.application' }

android {
    namespace 'com.rubenubaldo.setlistmusic'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rubenubaldo.setlistmusic'
        minSdk 23
        targetSdk 35
        versionCode 43
        versionName '4.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
