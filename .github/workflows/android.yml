name: Build Setlist Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Setlist-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
                - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Setlist Music APK v${{ github.run_number }}" \
            --notes "APK generado automáticamente por GitHub Actions."
