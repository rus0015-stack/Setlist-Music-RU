name: Build Setlist Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Copiar archivos web actualizados al APK
        run: |
          cp index.html android/app/src/main/assets/index.html
          cp logo-ruben-ubaldo-blanco.png android/app/src/main/assets/logo-ruben-ubaldo-blanco.png
          cp icon-192.png android/app/src/main/assets/icon-192.png
          cp icon-512.png android/app/src/main/assets/icon-512.png
          cp icon-512.png android/app/src/main/res/drawable/icon_512.png

      - name: Verificar archivos copiados
        run: |
          echo "Verificando archivos..."
          ls -lh android/app/src/main/assets/index.html
          ls -lh android/app/src/main/assets/logo-ruben-ubaldo-blanco.png
          ls -lh android/app/src/main/assets/icon-192.png
          ls -lh android/app/src/main/assets/icon-512.png
          echo "OK: archivos web copiados al APK"

      - name: Dar permisos al Gradle Wrapper
        working-directory: android
        run: chmod +x gradlew

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Setlist-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v5.0.${{ github.run_number }}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Setlist Music v5.0.${{ github.run_number }}" \
            --notes "APK generado automáticamente con el index.html actualizado."
