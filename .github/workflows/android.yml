name: Build Setlist Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Copiar index.html actualizado al APK
        run: |
          cp index.html android/app/src/main/assets/index.html

            - name: Verificar index.html copiado
        run: |
          echo "Verificando index.html..."
          ls -lh index.html
          ls -lh android/app/src/main/assets/index.html
          cmp index.html android/app/src/main/assets/index.html
          echo "OK: index.html copiado exactamente"

      - name: Dar permisos al Gradle Wrapper
        working-directory: android
        run: chmod +x gradlew

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Setlist-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v5.0.${{ github.run_number }}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Setlist Music v5.0.${{ github.run_number }}" \
            --notes "APK generado automáticamente con el index.html actualizado."

      - name: Dar permisos al Gradle Wrapper
        working-directory: android
        run: chmod +x gradlew

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar APK como Artifact
        uses: actions/upload-artifact@v4
